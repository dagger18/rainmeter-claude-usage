[Rainmeter]
Update=5000
AccurateText=1
BackgroundMode=2
SolidColor=15,15,22,240
DynamicWindowSize=0

[Metadata]
Name=Claude Code Usage Monitor
Version=4.7

[Variables]
FontFace=Segoe UI
PsSkin=#SKINSPATH#ClaudeUsage\FetchUsage.ps1
PyExe=powershell
SessionPct=0
WeeklyPct=0
SessionReset=--
WeeklyReset=--
LastUpdated=--
ErrMsg=

[MeasureScript]
Measure=Script
ScriptFile=#SKINSPATH#ClaudeUsage\reader.lua
UpdateDivider=1

[MeasureAutoRefresh]
Measure=Plugin
Plugin=RunCommand
Program=#PyExe# -WindowStyle Hidden -NonInteractive -File "#PsSkin#"
State=0
UpdateDivider=24
OnUpdateAction=[!CommandMeasure MeasureAutoRefresh "Run"][!UpdateMeasure MeasureScript][!UpdateMeter *][!Redraw]

[MeasureSessionBar]
Measure=Calc
Formula=#SessionPct#
MinValue=0
MaxValue=100
DynamicVariables=1

[MeasureWeeklyBar]
Measure=Calc
Formula=#WeeklyPct#
MinValue=0
MaxValue=100
DynamicVariables=1

[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,150,124,6 | Fill Color 13,13,20,248 | StrokeWidth 1 | Stroke Color 45,45,68,255

[MeterTopBar]
Meter=Shape
Shape=Rectangle 0,0,150,3,0 | Fill Color 0,200,190,255

[MeterSessionLabel]
Meter=String
X=8
Y=12
FontFace=#FontFace#
FontSize=10
FontWeight=700
FontColor=0,200,190,180
Text=5h
Antialias=1

[MeterSessionReset]
Meter=String
X=38
Y=12
FontFace=#FontFace#
FontSize=9
FontColor=180,180,210,255
Text=Re: #SessionReset#
DynamicVariables=1
Antialias=1

[MeterSessionPctText]
Meter=String
X=142
Y=12
FontFace=#FontFace#
FontSize=10
FontWeight=700
FontColor=0,200,190,255
StringAlign=Right
Text=#SessionPct#%
DynamicVariables=1
Antialias=1

[MeterSessionBarBg]
Meter=Shape
X=8
Y=30
Shape=RoundedRectangle 0,0,134,8,4 | Fill Color 30,30,46,255 | StrokeWidth 0

[MeterSessionBarFill]
Meter=Bar
X=8
Y=30
W=134
H=8
BarColor=0,200,190,255
BarOrientation=Horizontal
MeasureName=MeasureSessionBar

[MeterDivider1]
Meter=Shape
Shape=Line 8,48,142,48 | StrokeWidth 1 | Stroke Color 38,38,58,255

[MeterWeeklyLabel]
Meter=String
X=8
Y=56
FontFace=#FontFace#
FontSize=10
FontWeight=700
FontColor=150,90,255,180
Text=7d
Antialias=1

[MeterWeeklyReset]
Meter=String
X=38
Y=56
FontFace=#FontFace#
FontSize=9
FontColor=180,180,210,255
Text=Re: #WeeklyReset#
DynamicVariables=1
Antialias=1

[MeterWeeklyPctText]
Meter=String
X=142
Y=56
FontFace=#FontFace#
FontSize=10
FontWeight=700
FontColor=150,90,255,255
StringAlign=Right
Text=#WeeklyPct#%
DynamicVariables=1
Antialias=1

[MeterWeeklyBarBg]
Meter=Shape
X=8
Y=74
Shape=RoundedRectangle 0,0,134,8,4 | Fill Color 30,30,46,255 | StrokeWidth 0

[MeterWeeklyBarFill]
Meter=Bar
X=8
Y=74
W=134
H=8
BarColor=150,90,255,255
BarOrientation=Horizontal
MeasureName=MeasureWeeklyBar

[MeterDivider2]
Meter=Shape
Shape=Line 8,92,142,92 | StrokeWidth 1 | Stroke Color 38,38,58,255

[MeterBtnRefreshText]
Meter=String
X=8
Y=100
FontFace=#FontFace#
FontSize=7
FontWeight=600
FontColor=0,200,190,255
Text=Refresh
Antialias=1
LeftMouseUpAction=[!CommandMeasure MeasureAutoRefresh "Run"][!UpdateMeasure MeasureScript][!UpdateMeter *][!Redraw]

[MeterUpdated]
Meter=String
X=142
Y=100
FontFace=#FontFace#
FontSize=7
FontColor=55,55,80,255
StringAlign=Right
Text=Updated: #LastUpdated#
DynamicVariables=1
Antialias=1

[MeterError]
Meter=String
X=8
Y=112
W=134
FontFace=#FontFace#
FontSize=7
FontColor=220,80,80,255
Text=#ErrMsg#
DynamicVariables=1
Antialias=1
ClipString=1
LeftMouseUpAction=["explorer" "https://console.anthropic.com/settings/admin-keys"]
