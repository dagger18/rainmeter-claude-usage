; ============================================================
;  Settings.ini  —  Claude Code Usage Monitor
;  Edit your token and cost limits here, then click Save.
; ============================================================

[Rainmeter]
Update=1000
AccurateText=1
BackgroundMode=2
SolidColor=12,12,18,230

[Variables]
FontFaceUI=Segoe UI Variable
DimText=140,140,160

[Background]
Meter=Shape
Shape=Rectangle 0,0,340,300,8 | Fill Color 12,12,20,245 | StrokeWidth 1 | Stroke Color 50,50,75,200

[TopAccent]
Meter=Shape
Shape=Rectangle 0,0,340,3,0 | Fill LinearGradient G1
GradientAngle=90
G1=0;160,100,255,255 | 1;0,210,200,255

[Title]
Meter=String
X=18
Y=16
FontSize=12
FontWeight=700
FontColor=220,220,235,255
FontFace=#FontFaceUI#
Text=⚙  Edit Usage Limits
Antialias=1

[CloseBtn]
Meter=String
X=314
Y=14
FontSize=12
FontColor=100,100,130,255
FontFace=#FontFaceUI#
Text=✕
Antialias=1
LeftMouseUpAction=[!DeactivateConfig]

[Div1]
Meter=Shape
Shape=Line 18,42,322,42 | StrokeWidth 1 | Stroke Color 45,45,65,255

; ── Labels ──
[L1]
Meter=String
X=18
Y=52
FontSize=8
FontColor=#DimText#
FontFace=#FontFaceUI#
Text=Session token limit (default 200000)
Antialias=1

[SessionTokenLimitInput]
Meter=String
X=18
Y=68
W=290
H=22
FontSize=9
FontColor=220,220,235,255
FontFace=#FontFaceUI#
Text=200000
Antialias=1
InlineSetting=Background | 30,30,48,255
InlineSetting2=GradientColor | 0 | 50,50,75,255 | 50,50,75,255

[L2]
Meter=String
X=18
Y=100
FontSize=8
FontColor=#DimText#
FontFace=#FontFaceUI#
Text=Session cost limit USD (default 5.00)
Antialias=1

[SessionCostLimitInput]
Meter=String
X=18
Y=116
W=290
H=22
FontSize=9
FontColor=255,195,60,255
FontFace=#FontFaceUI#
Text=5.00
Antialias=1

[L3]
Meter=String
X=18
Y=148
FontSize=8
FontColor=#DimText#
FontFace=#FontFaceUI#
Text=Weekly token limit (default 2000000)
Antialias=1

[WeeklyTokenLimitInput]
Meter=String
X=18
Y=164
W=290
H=22
FontSize=9
FontColor=160,100,255,255
FontFace=#FontFaceUI#
Text=2000000
Antialias=1

[L4]
Meter=String
X=18
Y=196
FontSize=8
FontColor=#DimText#
FontFace=#FontFaceUI#
Text=Weekly cost limit USD (default 50.00)
Antialias=1

[WeeklyCostLimitInput]
Meter=String
X=18
Y=212
W=290
H=22
FontSize=9
FontColor=255,150,60,255
FontFace=#FontFaceUI#
Text=50.00
Antialias=1

[Div2]
Meter=Shape
Shape=Line 18,244,322,244 | StrokeWidth 1 | Stroke Color 40,40,60,255

; Note: Rainmeter doesn't have native input boxes — use !WriteKeyValue
; to persist variables and re-launch FetchUsage.ps1 with new args.
; Right-click any value meter above and choose "Edit skin" to change defaults.

[HelpText]
Meter=String
X=18
Y=252
FontSize=7
FontColor=#DimText#
FontFace=#FontFaceUI#
Text=Tip: Right-click → Edit skin to change defaults permanently.
Antialias=1

[SaveNote]
Meter=String
X=18
Y=266
FontSize=7
FontColor=0,210,200,160
FontFace=#FontFaceUI#
Text=Then edit SESSION_TOKEN_LIMIT in FetchUsage.ps1
Antialias=1
